<style>
  :root{
    --bg:#f6f4ef; --panel:#ffffff; --ink:#1c2430; --muted:#6b7280;
    --accent:#0b6e4f; --accent2:#c0392b; --line:#e5e0d5; --chip:#eef7f2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:22px 20px 18px;border-bottom:4px solid var(--accent)}
  header h1{margin:0;font-size:30px;letter-spacing:.5px}
  header p{margin:6px 0 0;color:#cfd6dd;font-size:15px;font-style:italic}
  .layout{display:flex;gap:0;max-width:1200px;margin:0 auto;align-items:stretch}
  nav{width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);padding:14px 0;min-height:70vh}
  nav h2{font-size:12px;letter-spacing:2px;color:var(--muted);margin:4px 18px 10px;text-transform:uppercase;font-family:Arial,sans-serif}
  .datebtn{display:block;width:100%;text-align:left;background:none;border:none;border-left:4px solid transparent;
    padding:10px 18px;cursor:pointer;font-family:Arial,sans-serif;font-size:14px;color:var(--ink)}
  .datebtn:hover{background:#faf8f3}
  .datebtn.active{border-left-color:var(--accent);background:var(--chip);font-weight:bold}
  .datebtn .cnt{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .pill{display:inline-block;background:var(--accent2);color:#fff;font-size:10px;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle;letter-spacing:.5px}
  main{flex:1;padding:20px 26px 40px;min-width:0}
  main h2.daytitle{margin:2px 0 4px;font-size:24px}
  main .daymeta{color:var(--muted);font-family:Arial,sans-serif;font-size:13px;margin-bottom:18px}
  section.cat{margin-bottom:22px}
  section.cat h3{font-family:Arial,sans-serif;font-size:13px;letter-spacing:2px;color:var(--accent);
    border-bottom:2px solid var(--line);padding-bottom:6px;margin:0 0 10px;text-transform:uppercase}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
  .item .num{display:inline-block;background:var(--ink);color:#fff;width:24px;height:24px;line-height:24px;text-align:center;
    border-radius:50%;font-family:Arial,sans-serif;font-size:13px;margin-right:9px;vertical-align:top}
  .item a{color:var(--ink);font-size:17px;font-weight:bold;text-decoration:none}
  .item a:hover{color:var(--accent);text-decoration:underline}
  .item .src{font-family:Arial,sans-serif;font-size:12.5px;color:var(--muted);margin:5px 0 3px 34px}
  .item .angle{font-size:14.5px;margin:0 0 0 34px;color:#374151;font-style:italic}
  footer{max-width:1200px;margin:0 auto;padding:0 26px 26px;color:var(--muted);font-family:Arial,sans-serif;font-size:12.5px}
  select#dateselect{display:none}
  @media (max-width:760px){
    .layout{flex-direction:column}
    nav{display:none}
    select#dateselect{display:block;width:100%;padding:11px;font-size:15px;margin-bottom:14px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
    main{padding:16px}
    header h1{font-size:24px}
  }
</style>
</head>

</div>

const CATS = ["Bangladesh","International","US Visa / Immigration","Dallas / Texas","Schools / Colleges","Community","Science / Tech","Sports","Entertainment"];
let current = 0;
function renderNav(){
  const nav = document.getElementById('datenav');
  nav.innerHTML = '<h2>Dates</h2>' + DAYS.map((d,i)=>
    `<button class="datebtn${i===current?' active':''}" onclick="show(${i})">${d.dateShort}${i===0?'<span class="pill">Latest</span>':''}<span class="cnt">${d.items.length} links</span></button>`
  ).join('');
  const sel = document.getElementById('dateselect');
  sel.innerHTML = DAYS.map((d,i)=>`<option value="${i}"${i===current?' selected':''}>${d.dateShort} · ${d.items.length} links</option>`).join('');
  sel.onchange = e => show(parseInt(e.target.value,10));
}
function show(i){
  current = i;
  const d = DAYS[i];
  renderNav();
  document.getElementById('daytitle').textContent = d.dateLabel;
  document.getElementById('daymeta').textContent = d.items.length + ' links · ' + CATS.filter(c=>d.items.some(x=>x.cat===c)).length + ' categories';
  let html = '';
  for(const c of CATS){
    const its = d.items.filter(x=>x.cat===c);
    if(!its.length) continue;
    html += `<section class="cat"><h3>${c}</h3>` + its.map(x=>
      `<div class="item"><span class="num">${x.n}</span><a href="${x.url}" target="_blank" rel="noopener">${x.headline}</a>` +
      `<div class="src">Source: ${x.source} &nbsp;|&nbsp; Published: ${x.published}</div>` +
      `<p class="angle">${x.angle}</p></div>`
    ).join('') + '</section>';
  }
  document.getElementById('items').innerHTML = html;
}
show(0);
</script>
